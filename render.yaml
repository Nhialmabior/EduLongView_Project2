# EduLongView preview deployment.
# Free Render web services sleep when idle and have an ephemeral filesystem.
# DATABASE_URL is intentionally not provisioned here: Render's free Postgres
# expires after 30 days. The app therefore uses SQLite for synthetic demo data
# only. Configure a persistent PostgreSQL DATABASE_URL before real school data.
services:
  - type: web
    name: edulongview-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://nhialmabior.github.io
      - key: FRONTEND_URL
        value: https://nhialmabior.github.io/EduLongView_Project2
