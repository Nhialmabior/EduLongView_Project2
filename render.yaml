services:
  - type: web
    name: edulongview-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # paste your PostgreSQL connection string
      - key: CORS_ORIGINS
        sync: false   # your frontend URL, e.g. https://your-site.netlify.app
